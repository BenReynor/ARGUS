# CI de ARGUS: tests en Linux y Windows y el instalador de Windows. Al subir
# una etiqueta v* también empaqueta Linux (.deb, .AppImage) y publica la release.
# Los tests usan el Discord falso local (wiremock): nunca un token ni la red real.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tsc + vite: además genera dist/, que la app incrusta al compilar.
      - name: Frontend
        run: npm run build

      - name: Tests de Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows-installer:
    name: Instalador (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Tauri mete en el instalador todos los binarios del crate: la app y
      # argus-mcp (queda junto a argus.exe).
      - name: Empaquetar (.msi y .exe)
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: argus-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux-paquetes:
    name: Paquetes (Linux)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04   # glibc más antigua: los paquetes funcionan en más distros
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Empaquetar (.deb y .AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # linuxdeploy sin FUSE en el runner
        run: npm run tauri build -- --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: argus-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [windows-installer, linux-paquetes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Los artefactos llegan en subcarpetas (msi/, nsis/, deb/, appimage/):
      # se juntan en una sola para publicarlos sueltos.
      - name: Juntar archivos y sumas SHA-256
        run: |
          mkdir publicar
          find dist -type f -exec mv {} publicar/ \;
          cd publicar && sha256sum * > SHA256SUMS && ls -la

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" publicar/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ARGUS $GITHUB_REF_NAME" \
            --generate-notes
