[package]
name = "argus"
version = "1.2.0"
license = "MIT"
edition = "2021"
# Hay dos binarios (la app y argus-mcp): `tauri build` necesita saber cuál es la app.
default-run = "argus"

[lib]
name = "argus_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = { version = "2", features = ["tracing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
twilight-gateway = "0.18"
twilight-http = "0.18"
twilight-model = "0.18"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros", "any"] }
aes-gcm = "0.11"
argon2 = "0.6"
machine-uid = "0.6"
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
getrandom = "0.4"
base64 = "0.23"
hyper = { version = "0.14", features = ["client", "http1", "tcp"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "http1"] }
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }
